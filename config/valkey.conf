# Disable unauthenticated default user
user default off

# Dedicated service user with access only to policy keys
user policy_service on >REPLACE_WITH_STRONG_VALKEY_PASSWORD ~policy:agg:* +@read +@write +@sortedset +@keyspace +ping

# Enforce TLS only (disable plaintext port)
port 0
tls-port 6379
tls-cert-file /certs/valkey.crt
tls-key-file /certs/valkey.key
tls-ca-cert-file /certs/ca.crt
tls-auth-clients yes

# Persistence
appendonly yes
dir /data
